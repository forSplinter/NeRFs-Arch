experiment_name: lot2_4x3090
dataset: lot2
basedir: ./logs
mlflow_uri: "http://0.0.0.0:8080"

data:
  train_path: "nerfdataset/lot2/transforms.json"
  use_full_dataset: true
  white_bkgd: true
  near: 0.3
  far: 13.702

model:
  type: "mipnerf"
  net_depth: 8
  net_width: 256
  net_depth_fine: 8
  net_width_fine: 256
  N_samples: 64           
  N_importance: 128          
  use_viewdirs: true
  use_embed: true
  multires: 10
  multires_views: 4
  white_bkgd: true
  use_hierarchical: true
  ray_chunk: 2048        
  pts_chunk: 4096           

training:
  batch_size: 2048        
  max_steps: 100000
  lr: 5e-4
  lr_decay_steps: 200000
  lr_decay_rate: 0.1
  lr_warmup_steps: 2000      
  multires: 10
  multires_views: 4
  lr_warmup_init: 1e-5
  i_print: 100
  i_weights: 5000
  i_testset: 10000

evaluation:
  save_images: false
  save_comparisons: false
  max_val_images: 5
  metrics: ["psnr", "ssim", "lpips"]

system:
  seed: 42
  precision: "fp32"
  benchmark: true
  deterministic: false
  device: "cuda"
