experiment_name: lot3_4x3090
dataset: lot3
mlflow_uri: "http://0.0.0.0:8080"
data:
  train_path: "nerfdataset/lot3/transforms_train.json"
  val_path: "nerfdataset/lot3/transforms_val.json"
  test_path: "nerfdataset/lot3/transforms_test.json"
  white_bkgd: false 
  near: 2.0 
  far: 8.0
model:
  type: "mipnerf"
  net_depth: 8
  net_width: 256
  net_depth_fine: 8
  net_width_fine: 256
  N_samples: 48          
  N_importance:  64         
  use_viewdirs: true
  use_embed: true
  multires: 10
  multires_views: 4
  white_bkgd: false
  use_hierarchical: true
  ray_chunk: 1024         
  pts_chunk: 4096          
training:
  batch_size:  1536        
  max_steps: 100000          
  lr: 3e-4
  lr_decay_steps: 20000 
  lr_decay_rate: 0.1
  lr_warmup_steps: 2000      
  lr_warmup_init: 1e-5
  i_print: 100
  i_weights: 10000
  i_testset: 50000
  num_workers: 8
evaluation:
  save_images: false
  save_comparisons: false
  max_val_images: 5
  metrics: ["psnr", "ssim", "lpips"]
system:
  seed: 42
  precision: "fp32"
  benchmark: true
  deterministic: false
  device: "cuda"