experiment_name: lot1_exp 
dataset: lot1
description: "Experiment lot1 with specific settings"
mlflow_uri: "http://localhost:5001"
data: 
  train_path: "nerfdataset/lot1/transforms_train.json"
  val_path: "nerfdataset/lot1/transforms_val.json"
  test_path: "nerfdataset/lot1/transforms_test.json"
  white_bkgd: true
  near: 0.1
  far: 100.0              
model:
  type: "mipnerf"
  net_depth: 8
  net_width: 256
  net_depth_fine: 8
  net_width_fine: 256
  N_samples: 64
  N_importance: 128
  use_viewdirs: true
  use_embed: true
  multires: 10
  multires_views: 4
  white_bkgd: true
  use_hierarchical: true
  ray_chunk: 2048         
  pts_chunk: 4096         
training:
  batch_size: 1024        
  max_steps: 200000
  lr: 5e-4
  lr_decay_steps: 100000 
  lr_decay_rate: 0.1
  i_print: 100
  i_weights: 10000
  i_testset: 20000
  num_workers: 4
evaluation:
  save_images: true
  save_comparisons: true
  max_val_images: 10
  metrics: ["psnr", "ssim", "lpips"]
system:
  seed: 42
  precision: "fp32"
  benchmark: true
  deterministic: false
  device: "cpu"          