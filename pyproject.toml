[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerfs-arch"
version = "1.0.0"
description = "DeepLearning project for COMP4471, NeRF-based archaeological artifact reconstruction"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Mathys Muganga", email = "rmmuganga@connect.ust.hk"},
    {name = "Aurelien Jouvenceau", email = "apgj@connect.ust.hk"},
    {name = "Xinwei Lin", email="elinae@connect.ust.hk"},
]
keywords = ["NeRF", "3D Reconstruction", "Computer Vision", "Deep Learning", "Archaeology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "torch>=2.9.0",
    "opencv-python>=4.7.0",
    "rembg>=2.0.31",
    "tqdm>=4.66.4",
    "pillow>=10.0.1",
    "scipy>=1.11.4",
    "scikit-learn>=1.3.2",
    "setuptools>=67.6.1",
    "imageio>=2.31.1",
    "imageio-ffmpeg>=0.4.10",
    "pandas>=2.2.4",
    "onnxruntime>=1.16.1",
    "vastai>=0.2.8",
]
[tool.setuptools.packages.find]
where = ["." ]
include = ["ci_cd*", "config*", "dataset*", "model*", "evaluation*", "pipeline*", "utils*", "scripts*"]
exclude = ["tests*", "docs*", "reports*", "notebooks*"]

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "pre-commit>=3.4.0",
    "pytest>=7.4.0",
    "vastai>=0.2.8",
]
[project.scripts]
preprocess = "dataset.preprocessing:main"
colmap2nerf = "scripts.colmaprunner:main"
