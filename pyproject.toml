[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerfs-arch"
version = "1.0.0"
description = "DeepLearning project for COMP4471, NeRF-based archaeological artifact reconstruction"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Mathys Muganga", email = "rmmuganga@connect.ust.hk"},
    {name = "Aurelien Jouvenceau", email = "apgj@connect.ust.hk"},
    {name = "Xinwei Lin", email="elinae@connect.ust.hk"},
]
keywords = ["NeRF", "3D Reconstruction", "Computer Vision", "Deep Learning", "Archaeology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = {text = "MIT"}
requires-python = ">=3.09"
dependencies = [
    "ipykernel",
    "matplotlib",
    "numpy",
    "torch",
    "opencv-python",
    "rembg",
    "tqdm",
    "pillow",
    "scipy",
    "scikit-learn",
    "setuptools",
    "imageio",
    "imageio-ffmpeg",
    "pandas",
    "onnxruntime",
    "vastai",
    "configargparse",
    "lpips",
    "mlflow",
    "pyyaml",
    "nerfstudio"
]
[tool.setuptools.packages.find]
where = ["." ]
include = ["config*", "dataset*", "model*", "evaluation*","utils*", "scripts*"]
exclude = ["tests*", "docs*", "reports*", "notebooks*"]

[tool.uv.extra-build-dependencies]
git = ["torch"]

[project.optional-dependencies]
dev = [
    "black>=23.9.1",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "pre-commit>=3.4.0",
    "pytest>=7.4.0",
    "vastai>=0.2.8",
    "pillow>=10.0.1",
    "pillow_heif>=0.7.0",
]
[project.scripts]
preprocess = "scripts.preprocessing:main"
colmap2nerf = "scripts.colmaprunner:main"
splitdataset = "scripts.splitdataset:main"
nerf = "scripts.nerf_runner:main"
render = "scripts.render:main"
